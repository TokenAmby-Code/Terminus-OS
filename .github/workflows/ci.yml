name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # One registry read credential, one name, everywhere (Emperor 2026-08-25):
  # the same TokenAmby-Package bot PAT that fleet-packages projects on the hosts.
  PACKAGES_READ: ${{ secrets.PACKAGES_READ }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun install --frozen-lockfile` exits 0 on a lockfile that is missing
      # entries the workspace manifests declare: it installs from the lockfile
      # and never re-resolves, so a divergent lockfile is invisible to it. A
      # plain resolving install is the only thing that reveals the drift, and
      # the drift strands every developer worktree it touches (githubd's phased
      # cleanup refuses a dirty worktree). Resolve, then require a clean tree.
      - name: Lockfile is in sync with the workspace manifests
        run: |
          bun install
          if ! git diff --quiet -- bun.lock; then
            echo "::error file=bun.lock::bun.lock is divergent from the workspace manifests. Run 'bun install' and commit bun.lock."
            git --no-pager diff -- bun.lock
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a resolving 'bun install' left the tree dirty"
            git --no-pager status --porcelain
            exit 1
          fi

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  # Integration lane for @terminus-os/db and the txd event store against a
  # live PostgreSQL 18.
  # CI is the one sanctioned TCP consumer; fleet machines use peer-auth
  # unix sockets. Trust auth keeps the no-password contract intact.
  db-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TERMINUS_DB_TEST_HOST: 127.0.0.1
      TERMINUS_DB_TEST_PORT: "5432"
      TERMINUS_DB_TEST_USERNAME: postgres
      TERMINUS_DB_TEST_DATABASE: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # These suites deliberately rebuild schemas and historical migration
      # fixtures. Keep them as separate processes against the disposable CI
      # authority so one reset cannot race another suite's forward-only ledger.
      - name: Database foundation integration
        run: bun test packages/db

      - name: txd PostgreSQL integration
        run: bun test packages/txd

      - name: busd PostgreSQL integration
        run: bun test packages/busd/test/store.test.ts

      - name: Replay PostgreSQL integration
        run: bun test packages/busd/test/replay-store.test.ts
