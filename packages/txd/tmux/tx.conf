# Canonical tmux interaction configuration for the tx estate.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -sg escape-time 0
set -g history-limit 50000
set -g mouse on
setw -g aggressive-resize on
set -g base-index 0
setw -g pane-base-index 0
set -g renumber-windows on
setw -g automatic-rename off
set -g allow-rename off

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix
bind Escape { }

# Managed agent Shift+Tab is a semantic txd action. The current process only
# selects managed-agent versus shell behavior; the canonical seat option is the
# sole identity crossing upward. txd records intent before input, resolves the
# bound engine, applies its harness-specific transition, and records read-back
# evidence. Bare estate shells retain native Shift+Tab behavior.
bind -n BTab if-shell -F '#{||:#{==:#{pane_current_command},claude},#{==:#{pane_current_command},codex}}' { run-shell -b '$HOME/.bun/bin/bun $HOME/.local/bin/tx mode toggle --target "#{@canonical_id}"' } { send-keys BTab }

set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour248"
set -g status-left-length 50
set -g status-left "#[fg=colour39,bold] #S #[default]| "
set -g status-right ""
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour39,bold] #I:#W #[default]"
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g pane-border-status top
set -g pane-border-format "#{?@PANE_LABEL, #[fg=colour231]#[bg=colour31]#[bold] #{@PANE_LABEL} #[default] ,}"

# Pane navigation and expansion. Prefix e toggles native zoom immediately.
# Prefix h/j/k/l moves once and opens a transient table where bare h/j/k/l or
# arrows keep moving; Enter zooms the selected pane and Escape/q cancel.
bind e resize-pane -Z
bind h { if -F '#{==:#{window_zoomed_flag},1}' 'resize-pane -Z' ; select-pane -L ; display-message "pane-select: h/j/k/l/arrows move, Enter expands" ; switch-client -T pane-select }
bind j { if -F '#{==:#{window_zoomed_flag},1}' 'resize-pane -Z' ; select-pane -D ; display-message "pane-select: h/j/k/l/arrows move, Enter expands" ; switch-client -T pane-select }
bind k { if -F '#{==:#{window_zoomed_flag},1}' 'resize-pane -Z' ; select-pane -U ; display-message "pane-select: h/j/k/l/arrows move, Enter expands" ; switch-client -T pane-select }
bind l { if -F '#{==:#{window_zoomed_flag},1}' 'resize-pane -Z' ; select-pane -R ; display-message "pane-select: h/j/k/l/arrows move, Enter expands" ; switch-client -T pane-select }
bind -T pane-select h { select-pane -L ; switch-client -T pane-select }
bind -T pane-select j { select-pane -D ; switch-client -T pane-select }
bind -T pane-select k { select-pane -U ; switch-client -T pane-select }
bind -T pane-select l { select-pane -R ; switch-client -T pane-select }
bind -T pane-select Left { select-pane -L ; switch-client -T pane-select }
bind -T pane-select Down { select-pane -D ; switch-client -T pane-select }
bind -T pane-select Up { select-pane -U ; switch-client -T pane-select }
bind -T pane-select Right { select-pane -R ; switch-client -T pane-select }
bind -T pane-select Enter resize-pane -Z
bind -T pane-select Escape display-message "pane-select cancelled"
bind -T pane-select q display-message "pane-select cancelled"
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Pane-local selection. Cursor motion and viewport navigation stay entirely
# inside tmux; only an explicit Enter commit invokes the private thin tx client.
set -g mode-keys emacs
set -g set-clipboard off
bind -n C-k copy-mode
unbind -a -T copy-mode
bind -T copy-mode Space send-keys -X begin-selection
bind -T copy-mode Left send-keys -X cursor-left
bind -T copy-mode Right send-keys -X cursor-right
bind -T copy-mode Up send-keys -X cursor-up
bind -T copy-mode Down send-keys -X cursor-down
bind -T copy-mode C-Left send-keys -X previous-word
bind -T copy-mode C-Right send-keys -X next-word
bind -T copy-mode Home send-keys -X start-of-line
bind -T copy-mode End send-keys -X end-of-line
bind -T copy-mode PPage send-keys -X page-up
bind -T copy-mode NPage send-keys -X page-down
bind -T copy-mode Tab send-keys -X other-end
bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel -P "$HOME/.bun/bin/bun $HOME/runtimes/Terminus-OS/live/packages/tx/bin/tx-selection --tty '#{client_tty}'"
bind -T copy-mode Escape send-keys -X cancel
bind -T copy-mode MouseDown1Pane select-pane
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
unbind -T copy-mode MouseDragEnd1Pane
unbind -T copy-mode-vi MouseDragEnd1Pane

%if "#{||:#{||:#{m:3.[4-9]*,#{version}},#{m:3.[1-9][0-9]*,#{version}}},#{m:[4-9].*,#{version}}}"
bind -n WheelUpPane if-shell -F '#{P:#{?pane_active,#{pane_in_mode},}}' {
  run-shell -C "send-keys -t '#{P:#{?pane_active,#{pane_id},}}' -X -N 3 scroll-up"
} {
  run-shell -C "copy-mode -e -t '#{P:#{?pane_active,#{pane_id},}}' ; send-keys -t '#{P:#{?pane_active,#{pane_id},}}' -X -N 3 scroll-up"
}
bind -n WheelDownPane if-shell -F '#{P:#{?pane_active,#{pane_in_mode},}}' {
  run-shell -C "send-keys -t '#{P:#{?pane_active,#{pane_id},}}' -X -N 3 scroll-down"
} {}
%else
display-message "tx.conf: tmux < 3.4 — wheel-scroll bindings skipped (upgrade tmux)"
%endif

%if "#{==:#{TXD_TMUX_SOCKET},k12}"
set -g remain-on-exit on

# Tmux is an event witness, never lifecycle truth. Keep an exited pane long
# enough to identify its canonical page, then forward the event to txd. tx is
# only the typed client; txd decides whether the declared page needs rebuilding.
set-hook -g pane-died 'run-shell -b "$HOME/.bun/bin/bun $HOME/.local/bin/tx estate event pane-died --page \"#{window_name}\""'
set-hook -g pane-exited 'run-shell -b "$HOME/.bun/bin/bun $HOME/.local/bin/tx estate event pane-exited --page \"#{window_name}\""'

# A kill command fires neither pane hook: `kill-pane` destroys the pane before
# any process-death hook can see it, so only the command hooks observe it —
# and their format context is the ACTIVE window, never the window that lost
# the pane. `kill-window` has no command hook at all; the window's unlink is
# its observable moment. Both forwards are page-less; txd sweeps the estate
# for the damage.
set-hook -g after-kill-pane 'run-shell -b "$HOME/.bun/bin/bun $HOME/.local/bin/tx estate event pane-killed"'
set-hook -g window-unlinked 'run-shell -b "$HOME/.bun/bin/bun $HOME/.local/bin/tx estate event pane-killed"'
%endif

bind r source-file ~/runtimes/Terminus-OS/live/packages/txd/tmux/tx.conf \; display "tx.conf reloaded"
